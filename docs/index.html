<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Corporate Affairs Intelligence</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  .watch{display:flex;flex-direction:column;gap:8px}
  .w{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
  .w:last-child{border-bottom:0}
  .w .when{
    font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.02em;
    color:var(--navy2);white-space:nowrap;min-width:104px;
  }
  .w .when small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
  .w .what{flex:1}
  .w .what b{color:var(--navy)}
  .w .what .note{color:var(--muted);font-size:13.5px}
  .w.done .when{color:var(--muted)}
  .w.done .what b{color:var(--muted)}
  @media (max-width:600px){ .w{flex-direction:column;gap:2px} .w .when{min-width:0} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Corporate Affairs Intelligence</h1>
    <div class="sub" id="meta">Loading…</div>
    <nav>
      <a href="index.html" class="active" aria-current="page">Feed</a>
      <a href="highrisk.html">High risk</a>
      <a href="watch.html">Future dates</a>
      <a href="information.html">Risk Definitions</a>
      <a href="sources.html">Sources</a>
    </nav>
  </div>
</header>

<main>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search titles, summaries…">
    <select id="fCat"><option value="">All categories</option></select>
    <select id="fRisk">
      <option value="">All risk levels</option>
      <option>High</option><option>Medium</option><option>Low</option>
    </select>
    <select id="fRel"><option value="">All comms relevance</option></select>
    <select id="fPeriod">
      <option value="7">Last 7 days</option>
      <option value="14" selected>Last 14 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 3 months</option>
      <option value="all">All time</option>
    </select>
    <span class="seg" role="group" aria-label="Group by">
      <button type="button" id="byDay" aria-pressed="true">Day</button>
      <button type="button" id="byWeek" aria-pressed="false">Week</button>
    </span>
  </div>

  <details class="panel" id="watchBox" style="display:none">
    <summary>Future dates to watch</summary>
    <div class="body"><div class="watch" id="watchList"></div></div>
  </details>

  <details class="panel" id="weeklyBox" style="display:none">
    <summary>Weekly briefing</summary>
    <div class="body md" id="weeklyMd"></div>
  </details>

  <div id="list"></div>
</main>

<footer>
  Updated automatically by the daily intelligence agent · <a href="admin.html">Admin</a>
</footer>

<script src="assets/site.js"></script>
<script>
"use strict";
let DATA = {items:[]};
let MODE = "day";

function renderWatch(){
  const w = (DATA.watchlist || []);
  if (!w.length) return;
  const upcoming = w
    .filter(x => x.status !== "resolved")
    .sort((a,b) => (a.date || "9999").localeCompare(b.date || "9999"));
  if (!upcoming.length) return;

  const row = x => {
    const prec = x.date_precision && x.date_precision !== "exact" ? `<small>${esc(x.date_precision)}</small>` : "";
    const when = x.date ? esc(fmtShort(x.date)) : "TBC";
    return `<div class="w">
      <span class="when">${when}${prec}</span>
      <span class="what"><b>${esc(x.title)}</b>
        <div class="note">${esc(x.what_happens || "")}</div></span>
    </div>`;
  };

  const shown = upcoming.slice(0,4);
  const more = upcoming.length - shown.length;
  $("#watchList").innerHTML = shown.map(row).join("") +
    `<div class="w"><span class="when"></span><span class="what">
       <a href="watch.html">${more > 0 ? `See all ${upcoming.length} upcoming dates` : "Open the full calendar"} →</a>
     </span></div>`;
  $("#watchBox").style.display = "";
  $("#watchBox").open = true;
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const cat = $("#fCat").value, risk = $("#fRisk").value, rel = $("#fRel").value;
  const period = $("#fPeriod").value;
  const cutoff = period === "all" ? "" : new Date(Date.now() - parseInt(period,10)*864e5).toISOString().slice(0,10);

  const items = (DATA.items || []).filter(it =>
    seenOn(it) >= cutoff &&
    (!cat || it.category === cat) && (!risk || it.risk === risk) && (!rel || it.comms_relevance === rel) &&
    (!q || JSON.stringify([it.title, it.summary, it.why_it_matters]).toLowerCase().includes(q))
  );

  $("#list").innerHTML = renderGroups(
    groupItems(items, MODE),
    "No items match — try widening the period or clearing filters."
  );
}

function populateFilters(){
  const cats = [...new Set((DATA.items || []).map(i => i.category).filter(Boolean))].sort();
  $("#fCat").innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option>${esc(c)}</option>`).join("");
  const order = ["Messaging Review Required","Executive Awareness Required","Potential Media Interest","Monitor Only"];
  const rels = [...new Set((DATA.items || []).map(i => i.comms_relevance).filter(Boolean))]
    .sort((a,b) => order.indexOf(a) - order.indexOf(b));
  $("#fRel").innerHTML = '<option value="">All comms relevance</option>' + rels.map(r => `<option>${esc(r)}</option>`).join("");
}

function setMode(m){
  MODE = m;
  $("#byDay").setAttribute("aria-pressed", String(m === "day"));
  $("#byWeek").setAttribute("aria-pressed", String(m === "week"));
  render();
}

(async function init(){
  try { DATA = await loadData(); }
  catch(e){
    $("#meta").textContent = "Could not load data.json";
    $("#list").innerHTML = '<div class="empty">Could not load data — if previewing locally, serve over http (not file://).</div>';
    return;
  }
  setMeta($("#meta"), DATA);
  if (DATA.weekly && DATA.weekly.markdown){
    $("#weeklyBox").style.display = "";
    $("#weeklyMd").innerHTML = md(DATA.weekly.markdown);
  }
  renderWatch();
  populateFilters();
  render();
})();

["q","fCat","fRisk","fRel","fPeriod"].forEach(id => document.getElementById(id).addEventListener("input", render));
$("#byDay").addEventListener("click", () => setMode("day"));
$("#byWeek").addEventListener("click", () => setMode("week"));
</script>
</body>
</html>
