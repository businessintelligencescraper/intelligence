<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Corporate Affairs Intelligence</title>
<style>
  :root{
    --navy:#12355b; --navy2:#1d4e89; --red:#c8102e;
    --bg:#f5f7fa; --card:#ffffff; --ink:#1c2733; --muted:#5b6b7b;
    --line:#e3e8ee;
    --lo:#e8f1e9; --lo-t:#2e6b34;
    --med:#fdf3e0; --med-t:#8a5a00;
    --hi:#fdeaea; --hi-t:#a31226;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  header{background:var(--navy);color:#fff;padding:18px 20px}
  .wrap{max-width:980px;margin:0 auto;padding:0 4px}
  header h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
  header .sub{font-size:12.5px;opacity:.75;margin-top:3px}
  header a{color:#cfe0f5}
  nav{display:flex;gap:6px;margin-top:13px}
  nav a{
    font-size:13.5px;font-weight:600;color:#cfe0f5;text-decoration:none;
    padding:6px 13px;border-radius:99px;line-height:1;
  }
  nav a:hover{background:rgba(255,255,255,.12);color:#fff}
  nav a.active{background:#fff;color:var(--navy)}
  nav a:focus-visible{outline:2px solid #fff;outline-offset:2px}
  main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px;align-items:center}
  .toolbar select,.toolbar input[type=search]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .weekly{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy2);border-radius:10px;margin-bottom:20px;overflow:hidden}
  .weekly summary{cursor:pointer;padding:12px 16px;font-weight:650;color:var(--navy);list-style:none}
  .weekly summary::before{content:"▸ ";color:var(--navy2)}
  .weekly[open] summary::before{content:"▾ "}
  .weekly .md{padding:0 20px 16px;border-top:1px solid var(--line)}
  .day{margin:26px 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:15.5px;line-height:1.35}
  .card h3 a{color:var(--navy);text-decoration:none}
  .card h3 a:hover{text-decoration:underline}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .badge{font-size:11px;font-weight:650;padding:2.5px 9px;border-radius:99px;letter-spacing:.02em}
  .b-cat{background:#eaf0f7;color:var(--navy2)}
  .b-risk-Low{background:var(--lo);color:var(--lo-t)}
  .b-risk-Medium{background:var(--med);color:var(--med-t)}
  .b-risk-High{background:var(--hi);color:var(--hi-t)}
  .b-rel{background:#f0ecf7;color:#59468b}
  .b-rel.hot{background:var(--hi);color:var(--hi-t)}
  .summary{margin:0 0 6px}
  .why{margin:0 0 6px;color:#334252}
  .why b{color:var(--navy)}
  .action{margin:0 0 6px;font-size:13.5px;color:var(--muted);font-style:italic}
  .srcs{font-size:12.5px;color:var(--muted)}
  .srcs a{color:var(--navy2)}
  .pub{opacity:.8}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:36px;text-align:center;color:var(--muted);margin-top:24px}
  footer{max-width:980px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--muted)}
  .md h1,.md h2{color:var(--navy);font-size:16px;margin:14px 0 6px}
  .md h1{font-size:17px}
  .md ul{margin:6px 0;padding-left:22px}
  .md p{margin:8px 0}
  .md a{color:var(--navy2)}
  @media (max-width:640px){ .toolbar{flex-direction:column;align-items:stretch} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Corporate Affairs Intelligence</h1>
    <div class="sub" id="meta">Loading…</div>
    <nav>
      <a href="index.html" class="active" aria-current="page">Feed</a>
      <a href="information.html">Information</a>
    </nav>
  </div>
</header>
<main>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search titles, summaries…">
    <select id="fCat"><option value="">All categories</option></select>
    <select id="fRisk">
      <option value="">All risk levels</option>
      <option>High</option><option>Medium</option><option>Low</option>
    </select>
    <select id="fRel"><option value="">All comms relevance</option></select>
    <select id="fDays">
      <option value="7">Last 7 days</option>
      <option value="14" selected>Last 14 days</option>
      <option value="30">Last 30 days</option>
    </select>
  </div>
  <details class="weekly" id="weeklyBox" style="display:none">
    <summary>Weekly Briefing</summary>
    <div class="md" id="weeklyMd"></div>
  </details>
  <div id="list"></div>
</main>
<footer>
  Updated automatically by the daily intelligence agent · <a href="admin.html">Admin</a>
</footer>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// minimal markdown → html (headings, bold, italics, links, lists, paragraphs)
function md(src){
  const lines=String(src||"").split(/\r?\n/); let out=[],inList=false;
  const inline=t=>esc(t)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>");
  for(const ln of lines){
    if(/^\s*[-*] /.test(ln)){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+inline(ln.replace(/^\s*[-*] /,""))+"</li>"); continue; }
    if(inList){out.push("</ul>");inList=false;}
    const h=ln.match(/^(#{1,3}) +(.*)/);
    if(h){ out.push(`<h${h[1].length}>`+inline(h[2])+`</h${h[1].length}>`); continue; }
    if(ln.trim()==="") continue;
    out.push("<p>"+inline(ln)+"</p>");
  }
  if(inList)out.push("</ul>");
  return out.join("\n");
}

let DATA={items:[]};
function relClass(r){ return /Executive|Messaging/.test(r||"")?"b-rel hot":"b-rel"; }
function fmtDate(d){ try{ return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});}catch(e){return d;} }
function fmtShort(d){ try{ return new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});}catch(e){return d;} }

function render(){
  const q=$("#q").value.trim().toLowerCase(), cat=$("#fCat").value, risk=$("#fRisk").value,
        rel=$("#fRel").value, days=parseInt($("#fDays").value,10);
  const cutoff=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  const seenOn=it=>it.first_seen||it.date||"";
  const items=(DATA.items||[]).filter(it=>
    seenOn(it)>=cutoff &&
    (!cat||it.category===cat) && (!risk||it.risk===risk) && (!rel||it.comms_relevance===rel) &&
    (!q||JSON.stringify([it.title,it.summary,it.why_it_matters]).toLowerCase().includes(q))
  );
  const byDay={};
  for(const it of items)(byDay[seenOn(it)]=byDay[seenOn(it)]||[]).push(it);
  const dayKeys=Object.keys(byDay).sort().reverse();
  const listEl=$("#list");
  if(!dayKeys.length){
    listEl.innerHTML='<div class="empty">No items match — the agent may not have run yet, or your filters are too narrow.</div>';
    return;
  }
  const rank={High:0,Medium:1,Low:2};
  const today=new Date().toISOString().slice(0,10);
  listEl.innerHTML=dayKeys.map(d=>
    `<div class="day">${d===today?"Today · ":""}${esc(fmtDate(d))}</div>`+
    byDay[d].sort((a,b)=>(rank[a.risk]??3)-(rank[b.risk]??3)).map(it=>{
      const primary=(it.sources&&it.sources[0])||{};
      return `<div class="card">
        <div class="badges">
          <span class="badge b-cat">${esc(it.category||"")}</span>
          <span class="badge b-risk-${esc(it.risk||"Low")}">${esc(it.risk||"")} risk</span>
          <span class="badge ${relClass(it.comms_relevance)}">${esc(it.comms_relevance||"")}</span>
        </div>
        <h3>${primary.url?`<a href="${esc(primary.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title)}</h3>
        <p class="summary">${esc(it.summary||"")}</p>
        ${it.why_it_matters?`<p class="why"><b>Why it matters:</b> ${esc(it.why_it_matters)}</p>`:""}
        ${it.recommended_action?`<p class="action">Recommended: ${esc(it.recommended_action)}</p>`:""}
        <div class="srcs">${(it.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.outlet||"source")}</a>`).join(" · ")}${it.date&&it.date!==seenOn(it)?` <span class="pub">· published ${esc(fmtShort(it.date))}</span>`:""}</div>
      </div>`;
    }).join("")
  ).join("");
}

function populateFilters(){
  const cats=[...new Set((DATA.items||[]).map(i=>i.category).filter(Boolean))].sort();
  $("#fCat").innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  const rels=[...new Set((DATA.items||[]).map(i=>i.comms_relevance).filter(Boolean))];
  const order=["Messaging Review Required","Executive Awareness Required","Potential Media Interest","Monitor Only"];
  rels.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  $("#fRel").innerHTML='<option value="">All comms relevance</option>'+rels.map(r=>`<option>${esc(r)}</option>`).join("");
}

async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now());
    DATA=await r.json();
  }catch(e){
    $("#meta").textContent="Could not load data.json";
    $("#list").innerHTML='<div class="empty">Could not load data — if previewing locally, serve over http (not file://).</div>';
    return;
  }
  const n=(DATA.items||[]).length;
  $("#meta").textContent=DATA.generated_at
    ? `Last updated ${new Date(DATA.generated_at).toLocaleString()} · ${n} items on file`
    : "Waiting for the first agent run";
  if(DATA.weekly&&DATA.weekly.markdown){
    $("#weeklyBox").style.display="";
    $("#weeklyMd").innerHTML=md(DATA.weekly.markdown);
  }
  populateFilters();
  render();
}
["q","fCat","fRisk","fRel","fDays"].forEach(id=>document.getElementById(id).addEventListener("input",render));
load();
</script>
</body>
</html>
