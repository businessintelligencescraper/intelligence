name: Send intelligence emails

on:
  push:
    branches: [main]
    paths:
      - "outbox/**"

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect what changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          echo "changed files: $CHANGED"
          echo "daily=$(echo "$CHANGED" | grep -c '^outbox/daily.md$' || true)" >> "$GITHUB_OUTPUT"
          echo "weekly=$(echo "$CHANGED" | grep -c '^outbox/weekly.md$' || true)" >> "$GITHUB_OUTPUT"
          echo "TODAY=$(TZ=America/New_York date +'%B %-d, %Y')" >> "$GITHUB_ENV"

      - name: Send daily brief
        if: steps.changes.outputs.daily != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Corporate Affairs Intelligence <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "CA Intelligence Daily Brief — ${{ env.TODAY }}"
          html_body: file://outbox/daily.md
          convert_markdown: true

      - name: Send weekly briefing
        if: steps.changes.outputs.weekly != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Corporate Affairs Intelligence <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "CA Intelligence Weekly Briefing — ${{ env.TODAY }}"
          html_body: file://outbox/weekly.md
          convert_markdown: true
