name: Send intelligence emails

# Email is deliberately infrequent: the Monday weekly briefing, plus an
# immediate alert whenever a scan finds a High-risk item. The daily digest is
# NOT emailed — it goes to digests/ and the dashboard.
#
# Each email is sent in TWO versions, to two recipient lists:
#   • general (MAIL_TO)       — everything above the "## Notes" heading.
#                               This is the version colleagues receive.
#   • admin   (MAIL_TO_ADMIN) — the complete file, including Notes.
# The general version is derived here by truncating at "## Notes", so the two
# can never drift apart.

on:
  push:
    branches: [main]
    paths:
      - "outbox/weekly.md"
      - "outbox/alert.md"

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect what changed and build general versions
        id: prep
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          echo "changed files: $CHANGED"
          echo "weekly=$(echo "$CHANGED" | grep -c '^outbox/weekly.md$' || true)" >> "$GITHUB_OUTPUT"
          echo "alert=$(echo "$CHANGED" | grep -c '^outbox/alert.md$' || true)" >> "$GITHUB_OUTPUT"
          echo "TODAY=$(TZ=America/New_York date +'%B %-d, %Y')" >> "$GITHUB_ENV"


          # ---- Freshness guard -------------------------------------------
          # Sending depends on the CONTENT being current, not on the file having
          # been touched. A cosmetic edit (a link change, a typo fix) by anyone
          # must never re-send an old alert. An alert mails only if dated today
          # or yesterday (ET); a weekly only if its week began within 7 days.
          # Anything unparseable or missing fails closed — no email.
          python3 - <<'FRESH'
          import os, re, time, datetime
          os.environ["TZ"] = "America/New_York"
          try: time.tzset()
          except AttributeError: pass
          today = datetime.date.fromtimestamp(time.time())

          def heading(path, n=5):
              try:
                  with open(path) as fh:
                      return "".join([next(fh, "") for _ in range(n)])
              except FileNotFoundError:
                  return ""

          def parse(text):
              m = re.search(r"([A-Z][a-z]+)\s+(\d{1,2})(?:,\s*(\d{4}))?", text)
              if not m: return None
              mon, day, yr = m.group(1), int(m.group(2)), m.group(3)
              try: mi = datetime.datetime.strptime(mon[:3], "%b").month
              except ValueError: return None
              try: return datetime.date(int(yr) if yr else today.year, mi, day)
              except ValueError: return None

          a = parse(heading("outbox/alert.md"))
          w = parse(heading("outbox/weekly.md", 3))
          af = 1 if a and 0 <= (today - a).days <= 1 else 0
          wf = 1 if w and 0 <= (today - w).days <= 7 else 0
          print(f"today(ET)={today} | alert dated {a} fresh={af} | weekly dated {w} fresh={wf}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"alert_fresh={af}\nweekly_fresh={wf}\n")
          FRESH

          # General version = everything before the "## Notes" heading, with any
          # trailing blank lines trimmed. A file without a Notes section passes
          # through whole, so a missing section can never produce an empty email.
          STRIP='/^## Notes[[:space:]]*$/{exit} {l[n++]=$0}
                 END{while(n>0 && l[n-1]=="") n--; for(i=0;i<n;i++) print l[i]}'
          for f in weekly alert; do
            if [ -f "outbox/$f.md" ]; then
              awk "$STRIP" "outbox/$f.md" > "outbox/$f-general.md"
              if [ ! -s "outbox/$f-general.md" ]; then
                echo "::error::outbox/$f-general.md came out empty — refusing to send a blank email"
                exit 1
              fi
              echo "--- outbox/$f-general.md: $(wc -l < "outbox/$f-general.md") lines (full: $(wc -l < "outbox/$f.md"))"
            fi
          done

      # ---------- High-risk alert ----------
      - name: Alert — general
        if: steps.prep.outputs.alert != '0' && steps.prep.outputs.alert_fresh == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Corporate Affairs Intelligence <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "⚠ High-Risk Alert — ${{ env.TODAY }}"
          html_body: file://outbox/alert-general.md
          convert_markdown: true

      - name: Alert — admin
        if: steps.prep.outputs.alert != '0' && steps.prep.outputs.alert_fresh == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Corporate Affairs Intelligence <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO_ADMIN || secrets.MAIL_TO }}
          subject: "[ADMIN] High-Risk Alert — ${{ env.TODAY }}"
          html_body: file://outbox/alert.md
          convert_markdown: true

      # ---------- Weekly briefing ----------
      - name: Weekly — general
        if: steps.prep.outputs.weekly != '0' && steps.prep.outputs.weekly_fresh == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Corporate Affairs Intelligence <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Corporate Affairs Intelligence — Weekly Briefing — ${{ env.TODAY }}"
          html_body: file://outbox/weekly-general.md
          convert_markdown: true

      - name: Weekly — admin
        if: steps.prep.outputs.weekly != '0' && steps.prep.outputs.weekly_fresh == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Corporate Affairs Intelligence <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO_ADMIN || secrets.MAIL_TO }}
          subject: "[ADMIN] Weekly Briefing — ${{ env.TODAY }}"
          html_body: file://outbox/weekly.md
          convert_markdown: true
